name: guitartuner
description: A high-performance, premium GuitarTuna clone mobile app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.2.0

  # Audio & Hardware Interfaces
  record: 5.0.4                        # low-latency mic streaming (PCM 16-bit)

  audioplayers: ^6.0.0                 # reference tones & perfect-tune chime
  permission_handler: ^11.3.1          # runtime microphone permission handling

  # Visuals & UI Design
  google_fonts: ^6.2.1                 # modern typography (e.g., Outfit)
  flutter_animate: ^4.5.0              # smooth animations & glows
  vibration: ^1.8.4                    # haptic feedback triggers

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
